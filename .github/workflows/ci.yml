name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - name: CLI smoke (help only, no network)
        run: |
          node cli/assets.mjs help > /dev/null
          node --check public/admin/app.js
